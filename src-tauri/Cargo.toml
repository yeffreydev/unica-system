[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# tauri-build aún está en 2.4.1
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

# 🔸 Núcleo Tauri (actual)
tauri = { version = "2.8.5", features = [] }

# 🔸 Plugins oficiales
tauri-plugin-log = "2.0.2"
tauri-plugin-shell = "2.0.2"
